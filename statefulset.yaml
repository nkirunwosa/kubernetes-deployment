
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: foodmart-statefulset
spec:
  selector:
  replicas: 3 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: foodmart # has to match .spec.selector.matchLabels
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: foodmart
        image: nkirucloud/foodmart:latest
        ports:
        - containerPort: 80
          name: foodmart
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "my-storage-class"
      resources:
        requests:
          storage: 1Gi
